baseURL = "https://kktae.github.io/"
locale = "ko"
defaultContentLanguage = "ko"
title = "kktae.io"
theme = "PaperMod"
mainSections = ["posts"]
hasCJKLanguage = true
timeZone = "Asia/Seoul"
enableRobotsTXT = true
disableHugoGeneratorInject = true
summaryLength = 30
# Git ignores are not Hugo publishing rules. Never publish local working notes.
ignoreFiles = ['(^|/)references(/|$)']

[languages.ko]
  direction = "ltr"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  defaultTheme = "light"
  description = "배우고 경험한 것들을 오래 기억하기 위해 정리하고 공유합니다. 일하며 발견한 생각과 문제 해결 과정, 시행착오, 다시 참고하고 싶은 내용과 시간이 지나도 가치가 남는 기록을 차분히 모아둡니다. 필요할 때 다시 꺼내볼 수 있는 개인 기록 공간입니다."
  seoTitle = "kktae.io | Notes, Ideas & Things Worth Remembering"
  socialImage = "images/social-preview.jpg"
  socialImageAlt = "Wind-swept corgi illustration used as the kktae.io social preview"
  githubRepo = "kktae/kktae.github.io"
  sourceBranch = "main"
  homePostLimit = 6
  curatedTags = ["GCP", "PSA", "PSC", "VPC", "IP Management", "Load Balancing", "Monitoring", "Vertex AI", "Gemini", "AI Agent"]
  ShowReadingTime = true
  ShowToc = true
  DateFormat = "2006.01.02"

  author = "kktae"


  [params.fuseOpts]
    threshold = 0.35
    ignoreLocation = true
    minMatchCharLength = 1
    limit = 20

[[menus.main]]
  identifier = "posts"
  name = "글"
  pageRef = "/posts"
  weight = 10
[[menus.main]]
  identifier = "series"
  name = "시리즈"
  pageRef = "/series"
  weight = 20
[[menus.main]]
  identifier = "search"
  name = "검색"
  pageRef = "/search"
  weight = 40

[[menus.footer]]
  name = "보관함"
  pageRef = "/archives"
  weight = 10
[[menus.footer]]
  name = "태그"
  pageRef = "/tags"
  weight = 20
[[menus.footer]]
  name = "RSS"
  url = "/index.xml"
  weight = 30
[[menus.footer]]
  name = "GitHub"
  url = "https://github.com/kktae"
  weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions.cjk]
      enable = true
      eastAsianLineBreaks = true
      eastAsianLineBreaksStyle = "simple"
      escapedSpace = true
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
