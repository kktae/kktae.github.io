baseURL = "https://kktae.github.io/"
locale = "ko"
defaultContentLanguage = "ko"
title = "kktae.io"
theme = "PaperMod"
mainSections = ["posts"]
hasCJKLanguage = true
timeZone = "Asia/Seoul"
enableRobotsTXT = true
disableHugoGeneratorInject = true
summaryLength = 30
# Git ignores are not Hugo publishing rules. Never publish local working notes.
ignoreFiles = ['(^|/)references(/|$)']

[languages.ko]
  direction = "ltr"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  defaultTheme = "light"
  description = "Google Cloud 인프라와 네트워킹, Private Service Access/Connect, Vertex AI, Gemini, AI Agent를 설계·운영하며 얻은 경험과 문제 해결 과정을 기록합니다."
  seoTitle = "kktae.io | Google Cloud, Networking & AI Engineering Notes"
  socialImage = "images/social-preview.jpg"
  socialImageAlt = "Wind-swept corgi illustration used as the kktae.io social preview"
  githubRepo = "kktae/kktae.github.io"
  sourceBranch = "main"
  homePostLimit = 6
  curatedTags = ["GCP", "PSA", "PSC", "VPC", "IP Management", "Load Balancing", "Monitoring", "Vertex AI", "Gemini", "AI Agent"]
  ShowReadingTime = true
  ShowToc = true
  DateFormat = "2006.01.02"

  author = "kktae"


  [params.fuseOpts]
    threshold = 0.35
    ignoreLocation = true
    minMatchCharLength = 1
    limit = 20

[[menus.main]]
  identifier = "posts"
  name = "글"
  pageRef = "/posts"
  weight = 10
[[menus.main]]
  identifier = "series"
  name = "시리즈"
  pageRef = "/series"
  weight = 20
[[menus.main]]
  identifier = "search"
  name = "검색"
  pageRef = "/search"
  weight = 40

[[menus.footer]]
  name = "보관함"
  pageRef = "/archives"
  weight = 10
[[menus.footer]]
  name = "태그"
  pageRef = "/tags"
  weight = 20
[[menus.footer]]
  name = "RSS"
  url = "/index.xml"
  weight = 30
[[menus.footer]]
  name = "GitHub"
  url = "https://github.com/kktae"
  weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions.cjk]
      enable = true
      eastAsianLineBreaks = true
      eastAsianLineBreaksStyle = "simple"
      escapedSpace = true
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
