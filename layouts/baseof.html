<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ site.Language.Direction }}" data-theme="{{ site.Params.defaultTheme }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body id="top">
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  {{- partial "header.html" . -}}
  <main class="main" id="main-content" tabindex="-1">
    {{- block "main" . }}{{ end -}}
  </main>
  {{- partial "footer.html" . -}}
</body>
</html>
