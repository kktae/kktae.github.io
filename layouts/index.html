{{ define "main" }}
<div class="reading-width">
  <section aria-labelledby="recent-posts">
    <div class="section-heading">
      <h1 id="recent-posts">최근 글</h1>
      <a href="{{ (site.GetPage "/posts").RelPermalink }}">전체 글 →</a>
    </div>
    {{- $posts := where (partial "posts.html" .) "Params.hiddenInHomeList" "ne" true -}}
    {{- range first site.Params.homePostLimit $posts.ByDate.Reverse -}}
      {{- partial "post-row-compact.html" . -}}
    {{- end }}
  </section>
</div>
{{ end }}
