<header class="site-header">
  <a class="site-name" href="{{ site.Home.RelPermalink }}">
    <img class="site-avatar" src="{{ "images/avatar-72.webp" | relURL }}" width="36" height="36" alt="" decoding="async" fetchpriority="high">
    {{ site.Title }}
  </a>
  <nav aria-label="주 메뉴">
    {{- range site.Menus.main }}
    {{- $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
    <a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
  <button id="theme-toggle" class="icon-button" type="button" aria-label="어두운 테마로 전환" hidden>
    <svg class="theme-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
    <svg class="theme-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
