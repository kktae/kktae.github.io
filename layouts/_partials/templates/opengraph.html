<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title | plainify }}">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title | plainify }}{{ else }}{{ .Title | plainify }}{{ end }}">
<meta property="og:description" content="{{ (or .Description .Summary site.Params.description) | plainify | htmlUnescape }}">
<meta property="og:locale" content="{{ replace site.Language.Locale `-` `_` }}">
{{- if .IsPage }}
{{- $iso8601 := "2006-01-02T15:04:05-07:00" -}}
<meta property="og:type" content="article">
{{- with .Section }}<meta property="article:section" content="{{ . }}">{{ end }}
{{- with .PublishDate }}<meta property="article:published_time" content="{{ .Format $iso8601 }}">{{ end }}
{{- with .Lastmod }}<meta property="article:modified_time" content="{{ .Format $iso8601 }}">{{ end }}
{{- range .GetTerms "tags" | first 6 }}<meta property="article:tag" content="{{ .Page.Title | plainify }}">{{ end }}
{{- else }}
<meta property="og:type" content="website">
{{- end }}
{{- with .Params.cover.image }}
<meta property="og:image" content="{{ if $.Params.cover.relative }}{{ (path.Join $.RelPermalink .) | absURL }}{{ else }}{{ . | absURL }}{{ end }}">
{{- end }}
