name: Validate and deploy Hugo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Python
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Setup Node.js
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Read pinned Hugo version
        id: versions
        shell: bash
        run: echo "hugo=$(tr -d '\r\n' < .hugo-version)" >> "$GITHUB_OUTPUT"
      - name: Setup Hugo
        # v3.2.1
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: ${{ steps.versions.outputs.hugo }}
          extended: true
      - name: Lint Python
        # v4.1.0
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          version: "0.16.8"
          args: "check scripts/check-browser.py scripts/check_dependencies.py tests/test_site.py"
      - name: Regression tests
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/fuse.test.mjs
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        # v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Strict production build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --panicOnWarning --cleanDestinationDir
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        # v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
